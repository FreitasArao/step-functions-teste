services:
  postgres:
    image: postgres:16-alpine
    container_name: step-function-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: saga_user
      POSTGRES_PASSWORD: saga_password
      POSTGRES_DB: order_saga_db
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_user -d order_saga_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  temporal:
    image: temporalio/auto-setup:latest
    container_name: order-saga-temporal
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=saga_user
      - POSTGRES_PWD=saga_password
      - POSTGRES_SEEDS=postgres
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:latest
    container_name: order-saga-temporal-ui
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    restart: unless-stopped
