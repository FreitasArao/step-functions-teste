services:
  postgres:
    image: postgres:16-alpine
    container_name: step-function-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: saga_user
      POSTGRES_PASSWORD: saga_password
      POSTGRES_DB: order_saga_db
    volumes:
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saga_user -d order_saga_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  localstack:
    image: localstack/localstack:latest
    container_name: step-function-localstack
    ports:
      - "4566:4566"
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=stepfunctions,sqs,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
      - DEBUG=1
      - EXTRA_CORS_ALLOWED_ORIGINS=https://app.localstack.cloud,http://localhost:3000
      - EXTRA_CORS_ALLOWED_HEADERS=*
      - DISABLE_CORS_CHECKS=1
    restart: unless-stopped
